<text x="26" y="34" font-size="19" font-weight="600" fill="#e6e9ef">## 🏛️ Where this sits in the organisation</text>
<line x1="26" y1="48" x2="794" y2="48" stroke="#242938" stroke-width="1"/>
<text x="26" y="99" font-size="13.5" fill="#e6e9ef">Nova-Violet Role builds convergent</text>
<text x="26" y="119" font-size="13.5" fill="#e6e9ef">cognitive frameworks, formally verified where it counts. RoT-MoE routes a</text>
<text x="26" y="139" font-size="13.5" fill="#e6e9ef">prompt through nine lenses; RoT-DTD-GOAL makes completion something a Stop</text>
<text x="26" y="159" font-size="13.5" fill="#e6e9ef">hook earns. This repository is the third piece: the commands themselves carry</text>
<text x="26" y="179" font-size="13.5" fill="#e6e9ef">a contract, and a Stop hook reads it. The contract DTDs of the two siblings are</text>
<text x="26" y="199" font-size="13.5" fill="#e6e9ef">the ancestors of dtd/cc-core.dtd, and their both-direction checkers are the</text>
<text x="26" y="219" font-size="13.5" fill="#e6e9ef">ancestors of rdc check.</text>
</svg>
