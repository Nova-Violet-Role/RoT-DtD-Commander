<text x="26" y="34" font-size="19" font-weight="600" fill="#1a1d24">Inter-operation</text>
<text x="794" y="34" font-size="15" fill="#5b6472" text-anchor="end">1</text>
<line x1="26" y1="58" x2="794" y2="58" stroke="#e2e5ec" stroke-width="1"/>
<rect x="26" y="74" width="700" height="24" rx="5" fill="#f2f4f8"/>
<text x="34" y="91" font-size="13.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1a1d24">/chain-dtd [two to eight command lines stacked, one /name-dtd per line, the first line's arguments the chain's; --no-gate runs the whole chain autonomously]</text>
<text x="794" y="91" font-size="12" fill="#5b6472" text-anchor="end">50 laws</text>
<text x="34" y="118" font-size="13" fill="#5b6472">DTD-native: several commands in one prompt as one declared chain. Reads the command</text>
<text x="34" y="137" font-size="13" fill="#5b6472">lines stacked in the arguments, plans the chain through lib/chain.mjs against</text>
<text x="34" y="156" font-size="13" fill="#5b6472">dtd/cc-chain.dtd, runs one intake and one gate for every link, hands each band's</text>
<text x="34" y="175" font-size="13" fill="#5b6472">artifact on as the next band's user-args, refuses by name a link that cannot run alone</text>
<text x="34" y="194" font-size="13" fill="#5b6472">or a successor the tree does not carry, and stamps the bands that ran into the record.</text>
<text x="34" y="213" font-size="13" fill="#5b6472">Autonomy only by the --no-gate token</text>
</svg>
