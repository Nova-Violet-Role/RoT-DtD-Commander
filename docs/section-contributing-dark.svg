<line x1="26" y1="48" x2="794" y2="48" stroke="#242938" stroke-width="1"/>
<text x="26" y="99" font-size="13.5" fill="#e6e9ef">Read CONTRIBUTING.md. The short form: edit src/, run</text>
<text x="26" y="119" font-size="13.5" fill="#e6e9ef">npm run build, run npm run gate, watch a control fail before you trust it,</text>
<text x="26" y="139" font-size="13.5" fill="#e6e9ef">and say what you could not verify. New commands are made with the</text>
<text x="26" y="159" font-size="13.5" fill="#e6e9ef">dtd-forge-dtd skill: grammar first, prose second.</text>
<text x="26" y="189" font-size="13.5" fill="#e6e9ef">What the software does with your data, and what we hold of it, is in</text>
<text x="26" y="209" font-size="13.5" fill="#e6e9ef">PRIVACY.md: nothing leaves your machine, and every line of it</text>
<text x="26" y="229" font-size="13.5" fill="#e6e9ef">names the measurement.</text>
