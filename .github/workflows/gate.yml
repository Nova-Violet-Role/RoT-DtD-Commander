#
# The gate, as CI. The `gate` job runs the same chain as `npm run gate`, one
# step per command, and its first step proves every command of that chain
# is a run line of this file or a shell segment of one (checker/gate-sync.mjs;
# a step commented out counts for nothing; this file may run more, and that
# direction is not claimed). The `install-roundtrip` job installs into a
# scratch target and uninstalls back to zero files. The `release` job runs
# only on a tag `v*`, after both, and ships the GitHub release with the
# CHANGELOG section of that version as its notes; a tag whose version is not
# package.json's, or whose section is still marked in progress, ships
# nothing.
name: gate
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: this workflow runs every command of the gate script (checker/gate-sync.mjs, with its control)
        run: node checker/gate-sync.mjs
      - name: build drift (committed resolved tree equals a fresh resolve of src/)
        run: node bin/rot-dtd-commander.mjs build --check; echo "exit=$?"; node bin/rot-dtd-commander.mjs build --check
      - name: checker C1..C14 on every source
        run: |
          node bin/rot-dtd-commander.mjs check | tee "$RUNNER_TEMP/check.log"
          test "${PIPESTATUS[0]}" -eq 0
          grep -q 'failed 0' "$RUNNER_TEMP/check.log"
      - name: heading shape (every grammar_map heading is a sigil heading with blank lines; the sweep is a no-op)
        run: node checker/heading-sweep.mjs --check
      - name: front matter parses as YAML (no bare colon-space or hash in a value; the sweep is a no-op)
        run: node checker/frontmatter-sweep.mjs --check
      - name: adiutor controls (twenty-nine guards tripped on purpose; C21 to C29 the AI_SLOP gate on five spots, the tally and the fields)
        run: node bin/adiutor.mjs controls
      - name: contract audit (both directions, three planted controls)
        run: node checker/contract-audit.mjs
      - name: checker controls (M0 to M17 - seven mutations refused, one under INCLUDE and the untouched file pass, nine scorer and runner controls)
        run: bash checker/checker-controls.sh
      - name: spdx sweep
        run: bash checker/spdx-sweep.sh
      - name: crlf sweep
        run: bash checker/crlf-sweep.sh
      - name: ordinals controls (IUPAC and Greek prefixes, next and parse)
        run: node lib/ordinals.mjs controls
      - name: ai-slop controls (the sloppy fixture is caught, the clean one passes, the sweep floor)
        run: node lib/ai-slop.mjs controls
      - name: ceiling controls (every unattended runner ends at its ceiling)
        run: bash checker/ceiling-controls.sh
      - name: form controls (callout, heredoc, yaml, nt, xml, polyglot, alarm)
        run: node lib/form.mjs controls
      - name: args controls
        run: node lib/args.mjs controls
      - name: schematic controls (render, read back, matrix, check)
        run: node lib/schematic.mjs controls
      - name: workflow controls (validate, run, ceiling, cleanup)
        run: node lib/workflow.mjs controls
      - name: task controls (validate, expand, audit, run, ledger)
        run: node lib/task.mjs controls
      - name: record controls (nesting, declared records, the newest file judged)
        run: node lib/record.mjs controls
      - name: license controls (fifty SPDX ids with definitions)
        run: node lib/license.mjs controls
      - name: scratch controls (a worktree opened, diffed, merged by marked paths and whole, an overwrite refused, reverted after a red gate, discarded)
        run: node lib/scratch.mjs controls
      - name: amplify controls (the ladder, the bands, the ids, the paging, the state record, the release recognizer, a ceiling tripped on purpose)
        run: node lib/amplify.mjs controls
      - name: every engine a shipped command invokes is a file the installer writes (two families once shipped without theirs)
        run: node checker/engines-sweep.mjs && node checker/engines-sweep.mjs --controls
      - name: the About and the three manifest descriptions say what the tree measures (the About sat two majors behind because nothing read it)
        run: node checker/about-sweep.mjs && node checker/about-sweep.mjs --controls
      - name: the generated table of the list grammar still equals the declarations it was generated from
        run: node lib/list.mjs table --check
      - name: this repository's own lists leave it able to build itself, and no file under .rot-lists is undeclared
        run: node lib/list.mjs reach --repo-only
      - name: the lists refuse a mix that would leave a repository unable to build itself, and the eight commands stay in step with the subset they share
        run: node lib/list.mjs controls
      - name: a manager absent from the machine is reported absent, and an install of a blacklisted tool is refused before its confirmation
        run: node lib/starlist.mjs controls
      - name: ai-slop sweep over every source (no tell allowed)
        run: node lib/ai-slop.mjs sweep src/commands src/skills src/agents --max 0
      - name: the generated contract and the growth state record pass the same measures
        run: node lib/ai-slop.mjs dtd/ladder.md && node lib/ai-slop.mjs sweep artifacts/amplify-codebase
      - name: the root documents pass the slop measures (the release ships a changelog section)
        run: node lib/ai-slop.mjs README.md && node lib/ai-slop.mjs CHANGELOG.md && node lib/ai-slop.mjs NOTICE.md && node lib/ai-slop.mjs SECURITY.md && node lib/ai-slop.mjs PRIVACY.md && node lib/ai-slop.mjs RELEASE.md
      - name: every build target is tracked (an ignored target passes here and drifts on a fresh checkout)
        run: bash checker/tracked-sweep.sh
      - name: the README index names every command, skill and agent of the tree (generated; its controls)
        run: node checker/readme-index.mjs --check && node checker/readme-index.mjs --controls
      - name: every published count equals the tree (badges, tagline, claims rows, the three manifests; its controls)
        run: node checker/counts-sweep.mjs && node checker/counts-sweep.mjs --controls
      - name: one version everywhere (package.json, plugin.json, marketplace.json, the changelog, RELEASE.md)
        run: node checker/release-notes.mjs --versions
      - name: release-notes controls (the release job's instrument can fail)
        run: node checker/release-notes.mjs --controls
      - name: every tape has a committed GIF under 2 MB
        run: |
          rc=0
          for t in docs/tapes/*.tape; do
            g="docs/gifs/$(basename "$t" .tape).gif"
            if [ ! -f "$g" ]; then echo "MISSING $g"; rc=1; continue; fi
            s=$(stat -c %s "$g"); echo "$g $s bytes"
            [ "$s" -le 2097152 ] || { echo "TOO LARGE $g"; rc=1; }
          done
          exit $rc
      - name: executable bits in the index
        run: |
          bad=$(git ls-files -s bin/ checker/*.sh | grep -v '^100755' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          echo "ok: every script is executable in the index"

  install-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install into a scratch target, doctor, uninstall to zero
        run: |
          T=$(mktemp -d)
          node bin/rot-dtd-commander.mjs install --yes --target "$T" | tail -3
          test -f "$T/.rot-dtd-commander-manifest.json"
          CLAUDE_CONFIG_DIR="$T" node bin/adiutor.mjs doctor || true
          node bin/rot-dtd-commander.mjs uninstall --yes --target "$T" | tail -1
          left=$(find "$T" -type f | wc -l)
          echo "files left: $left"
          test "$left" -eq 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, install-roundtrip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: the tag names the one version the manifests, the changelog and RELEASE.md share
        run: node checker/release-notes.mjs --versions "$GITHUB_REF_NAME"
      - name: the notes are the CHANGELOG section of that version, dated, no longer in progress
        run: |
          node checker/release-notes.mjs "${GITHUB_REF_NAME#v}" > notes.md
          test -s notes.md
          wc -c notes.md
          head -5 notes.md
      - name: ship the release (a release already on the tag is left alone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
        run: |
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json")
          code=$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "$API/releases/tags/$GITHUB_REF_NAME")
          if [ "$code" = "200" ]; then echo "release $GITHUB_REF_NAME already exists: nothing shipped"; exit 0; fi
          node checker/release-notes.mjs --payload "$GITHUB_REF_NAME" > payload.json
          code=$(curl -s -o response.json -w '%{http_code}' -X POST "${auth[@]}" "$API/releases" --data @payload.json)
          echo "http $code"
          test "$code" = "201" || { cat response.json; exit 1; }
          node -e 'const r=require("./response.json");console.log("shipped", r.tag_name, r.name, r.html_url)'
