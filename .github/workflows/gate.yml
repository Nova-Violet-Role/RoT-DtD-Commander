# Copyright 2026 Saimonokuma.
#
# The gate, as CI, on every leg. The `gate` job runs the same chain as
# `npm run gate`, one step per command, on the three legs dtd/cross-os.dtd
# declares as XOS.legs; its first step proves every command of that chain is
# a run line of this file or a shell segment of one (checker/gate-sync.mjs; a
# step commented out counts for nothing; this file may run more, and that
# direction is not claimed). The `install-roundtrip` job installs into a
# scratch target and uninstalls back to zero files, on the same three legs.
# The `release` job runs only on a tag `v*`, after every leg of both, and
# ships the GitHub release with the CHANGELOG section of that version as its
# notes; a tag whose version is not package.json's, or whose section is still
# marked in progress, ships nothing.
#
# Until 8.0.0 all five jobs ran on ubuntu-latest and nothing had ever run on
# macOS: three checkers called the timeout binary and the encoding sweep used
# mapfile and grep -P, none of which the macOS runner has. node lib/cross-os.mjs
# matrix --check refuses this file if a job below drops a leg (LAW.XOS.6), and
# node lib/cross-os.mjs sweep refuses a run line carrying a form a leg lacks
# (LAW.XOS.4). Every scratch path is made by mktemp and passed through cygpath
# where it exists, so bash and node name the same directory on Windows.
name: gate
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      XOS_LEG: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: a scratch directory both bash and node can name on this leg
        run: |
          T=$(mktemp -d); T=$(cygpath -m "$T" 2>/dev/null || echo "$T")
          echo "SCRATCH=$T" >> "$GITHUB_ENV"
          echo "leg $XOS_LEG, scratch $T, $(node --version), $(bash --version | head -1)"
      - name: this workflow runs every command of the gate script (checker/gate-sync.mjs, with its control)
        run: node checker/gate-sync.mjs
      - name: build drift (committed resolved tree equals a fresh resolve of src/)
        run: node bin/rot-dtd-commander.mjs build --check
      - name: checker C1..C16 on every source
        run: |
          node bin/rot-dtd-commander.mjs check | tee "$SCRATCH/check.log"
          test "${PIPESTATUS[0]}" -eq 0
          grep -q 'failed 0' "$SCRATCH/check.log"
      - name: heading shape (every grammar_map heading is a sigil heading with blank lines; the sweep is a no-op)
        run: node checker/heading-sweep.mjs --check
      - name: front matter parses as YAML (no bare colon-space or hash in a value; the sweep is a no-op)
        run: node checker/frontmatter-sweep.mjs --check
      - name: adiutor controls (thirty-one guards tripped on purpose; C21 to C29 the AI_SLOP gate on five spots, the tally and the fields; C30 the lists at Write; C31 the gate law of cc-cache at Stop)
        run: node bin/adiutor.mjs controls
      - name: contract audit (both directions, three planted controls)
        run: node checker/contract-audit.mjs
      - name: checker controls (M0 to M29 - seven mutations refused, one under INCLUDE and the untouched file pass, twenty-three scorer and runner controls)
        run: bash checker/checker-controls.sh
      - name: spdx sweep
        run: bash checker/spdx-sweep.sh
      - name: crlf sweep (bytes read in Node since 8.0.0, so the macOS leg can run it)
        run: bash checker/crlf-sweep.sh
      - name: ordinals controls (IUPAC and Greek prefixes, next and parse)
        run: node lib/ordinals.mjs controls
      - name: ai-slop controls (the sloppy fixture is caught, the clean one passes, the sweep floor)
        run: node lib/ai-slop.mjs controls
      - name: ceiling controls (every unattended runner ends at its ceiling, through the portable ceil)
        run: bash checker/ceiling-controls.sh
      - name: form controls (callout, heredoc, yaml, nt, xml, polyglot, alarm)
        run: node lib/form.mjs controls
      - name: args controls
        run: node lib/args.mjs controls
      - name: schematic controls (render, read back, matrix, check)
        run: node lib/schematic.mjs controls
      - name: workflow controls (validate, run, ceiling, cleanup)
        run: node lib/workflow.mjs controls
      - name: task controls (validate, expand, audit, run, ledger)
        run: node lib/task.mjs controls
      - name: record controls (nesting, declared records, the newest file judged)
        run: node lib/record.mjs controls
      - name: license controls (fifty SPDX ids with definitions)
        run: node lib/license.mjs controls
      - name: scratch controls (a worktree opened, diffed, merged by marked paths and whole, an overwrite refused, reverted after a red gate, discarded)
        run: node lib/scratch.mjs controls
      - name: amplify controls (the ladder, the bands, the ids, the paging, the state record, the release recognizer, a ceiling tripped on purpose)
        run: node lib/amplify.mjs controls
      - name: regression, extention, retenue controls (a lying claim, a negated one, a vestigial declaration reasoned above and below, a real removal, a rewrite that is not one)
        run: node lib/regression.mjs controls
      - name: the portable ceiling fires with exit 124 on this leg, and keeps a child's own exit otherwise (LAW.XOS.5)
        run: node lib/ceiling.mjs controls
      - name: the encoding sweep reads bytes and its three planted files are caught (LAW.XOS.4)
        run: node lib/encoding.mjs controls
      - name: cross-os controls (the substrates probed and never guessed, the eight forms refused by name, both ceiling paths, the matrix held)
        run: node lib/cross-os.mjs controls
      - name: no gate instrument carries a form a leg lacks, and this workflow runs every leg (LAW.XOS.4, LAW.XOS.6)
        run: node lib/cross-os.mjs sweep && node lib/cross-os.mjs matrix --check
      - name: figure controls (one figure, two renderers, the character grid the bound, a shape module switched off through the driver)
        run: node lib/figure.mjs controls
      - name: geometry controls (one hundred and eight rungs, three profession bands and four domain bands, the lenses a partition, a survey that moves nothing, a plan that rewrites nothing, a renovation and a production refused by name, a band and a domain switched off)
        run: node lib/geometry.mjs controls
      - name: typography controls (the cell shared with cc-figure, the seven glyphs glyph for glyph, the guarantee and what falls outside it, the numeral derived from the number, every declaration spent)
        run: node lib/typography.mjs controls
      - name: chain controls (stacked command lines read both ways, the cap, a link that cannot run alone, a successor that does not exist, every hands_to in the tree resolving)
        run: node lib/chain.mjs controls
      - name: sigil controls (the five documents present, the forms named to tokens to the ranking in both directions, a planted miss each way, the one convention measured on the tree, a trial past the ceiling killed)
        run: node lib/sigil.mjs controls
      - name: the sigil's forms run on this leg (pass, fail or unsupported with the bash it needs; three legs, three honest tallies)
        run: node lib/sigil.mjs run
      - name: cache controls (the eight fields in order, a byte-equal reread, both nt guards, no value ever typed, stale by date, every refusal by name, and the nt lighter than the markdown of the same state)
        run: node lib/cache.mjs controls
      - name: the controls sweep is tripped on a planted false count before it is trusted
        run: node checker/controls-sweep.mjs --controls
      - name: every controls count the release block claims is re-run and agrees (the companion found one that did not)
        run: node checker/controls-sweep.mjs --check
      - name: the enumeration sweep is tripped on a planted omission and a planted undeclared value
        run: node checker/enum-sweep.mjs --controls
      - name: every choice a template spells is the enumeration its grammar declares (the fifth companion pass found a carve-out that reached everything but the command)
        run: node checker/enum-sweep.mjs --check
      - name: scala controls (one scala per family stacked in band order, a planted answer missing a heading, out of order, short of its close, or quoting a heading in prose, each refused by name)
        run: node checker/scala.mjs --controls
      - name: the creators against the corpus, per folder (one schematic with its concept cells or a refusal with its reason; the corpus absent here and said so; the record in step)
        run: node checker/creators-audit.mjs --check && node checker/creators-audit.mjs --controls
      - name: every engine a shipped command invokes is a file the installer writes (two families once shipped without theirs)
        run: node checker/engines-sweep.mjs && node checker/engines-sweep.mjs --controls
      - name: the About and the three manifest descriptions say what the tree measures (the About sat two majors behind because nothing read it)
        run: node checker/about-sweep.mjs && node checker/about-sweep.mjs --controls
      - name: the generated table of the list grammar still equals the declarations it was generated from
        run: node lib/list.mjs table --check
      - name: this repository's own lists leave it able to build itself, and no file under .rot-lists is undeclared
        run: node lib/list.mjs reach --repo-only
      - name: the lists refuse a mix that would leave a repository unable to build itself, and the eight commands stay in step with the subset they share
        run: node lib/list.mjs controls
      - name: a manager absent from the machine is reported absent, and an install of a blacklisted tool is refused before its confirmation
        run: node lib/starlist.mjs controls
      - name: ai-slop sweep over every source (no tell allowed)
        run: node lib/ai-slop.mjs sweep --tracked src/commands src/skills src/agents --max 0
      - name: the sigil study documents and the research records pass the same measures (the companion audit of 9.0.0 found both directories outside every sweep)
        run: node lib/ai-slop.mjs sweep --tracked dtd/sigil artifacts/research --max 0
      - name: the two generated contracts and the growth state record pass the same measures
        run: node lib/ai-slop.mjs dtd/ladder.md && node lib/ai-slop.mjs dtd/geometry.md && node lib/ai-slop.mjs sweep artifacts/amplify-codebase
      - name: the nine root documents and the hosted doc pass the slop measures (the release ships a changelog section)
        run: node lib/ai-slop.mjs README.md && node lib/ai-slop.mjs CHANGELOG.md && node lib/ai-slop.mjs NOTICE.md && node lib/ai-slop.mjs SECURITY.md && node lib/ai-slop.mjs PRIVACY.md && node lib/ai-slop.mjs RELEASE.md && node lib/ai-slop.mjs CONTRIBUTING.md && node lib/ai-slop.mjs CODE_OF_CONDUCT.md && node lib/ai-slop.mjs SUPPORT.md && node lib/ai-slop.mjs docs/HOSTED-PLUGIN.md
      - name: every build target is tracked (an ignored target passes here and drifts on a fresh checkout)
        run: bash checker/tracked-sweep.sh
      - name: the README index names every command, skill and agent of the tree (generated; its controls)
        run: node checker/readme-index.mjs --check && node checker/readme-index.mjs --controls
      - name: the glossary agrees with the tree, and every guard on it trips
        run: node checker/glossary.mjs --check && node checker/glossary.mjs --controls
      - name: plates (sixteen README plates rendered from the README's own text and held to a fresh render; planted drift tripped)
        run: node checker/plates.mjs --check && node checker/plates.mjs --controls
      - name: subsets (every grammar the dtd-core reference quotes equals its file in dtd/; every cc-*.dtd quoted; a planted character tripped)
        run: node checker/subsets-sweep.mjs --check && node checker/subsets-sweep.mjs --controls
      - name: no comment claims a reader that does not read it, no declaration survives unread without its reason, and no controls verb the gate never runs stays unexplained
        run: node lib/regression.mjs claims && node lib/regression.mjs retenue && node lib/regression.mjs unreached
      - name: every published count equals the tree (badges, tagline, claims rows, the three manifests; its controls)
        run: node checker/counts-sweep.mjs --controls
      - name: one version everywhere (package.json, plugin.json, marketplace.json, the changelog, RELEASE.md)
        run: node checker/release-notes.mjs --versions
      - name: release-notes controls (the release job's instrument can fail)
        run: node checker/release-notes.mjs --controls
      - name: every tape has a committed GIF under 2 MB
        run: |
          rc=0
          for t in docs/tapes/*.tape; do
            g="docs/gifs/$(basename "$t" .tape).gif"
            if [ ! -f "$g" ]; then echo "MISSING $g"; rc=1; continue; fi
            s=$(( $(wc -c < "$g") )); echo "$g $s bytes"
            [ "$s" -le 2097152 ] || { echo "TOO LARGE $g"; rc=1; }
          done
          exit $rc
      - name: executable bits in the index
        run: |
          bad=$(git ls-files -s bin/ checker/*.sh | grep -v '^100755' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          echo "ok: every script is executable in the index"
      - name: the two hosted badges are a fresh render, and their guards trip
        run: node checker/badges.mjs --check && node checker/badges.mjs --controls
      - name: the hosted-plugin Guard trips every one of its own controls
        run: node checker/pack-claude-ai.mjs --controls
      - name: every hosted candidate builds and passes H0 to H12
        run: |
          # The wrapped candidates were the control for a manifest rule that an
          # upload falsified on 2026-09-05: dotbin-wrapped installed on both
          # surfaces. H2 was withdrawn and the step that required these to FAIL
          # went with it. Every candidate is now required to pass.
          node checker/pack-claude-ai.mjs --all --out "$SCRATCH/hosted"
          node checker/pack-claude-ai.mjs --check "$SCRATCH"/hosted/*.zip
      - name: the proven combination builds under its release name
        run: |
          node checker/pack-claude-ai.mjs --out "$SCRATCH/canon"
          ls -l "$SCRATCH/canon"
          v=$(node -e 'process.stdout.write(require("./.claude-plugin/plugin.json").version)')
          test -f "$SCRATCH/canon/claude_ai_cowork_rot_dtd_commander_${v}.zip"
          echo "ok: the release asset name follows the manifest version"

  install-roundtrip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      XOS_LEG: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install into a scratch target, doctor, uninstall to zero
        run: |
          # cygpath makes the scratch path one both bash and node resolve to the
          # same directory on the Windows leg; elsewhere it is absent and the
          # mktemp path stands.
          T=$(mktemp -d); T=$(cygpath -m "$T" 2>/dev/null || echo "$T")
          # The logs live outside the target. Written into it, the three of them
          # were the three files the "uninstall to zero" test then found left
          # over, so that test could never pass; it went unseen because the
          # doctor grep above it failed first (pass 27, caught by CI).
          L=$(mktemp -d); L=$(cygpath -m "$L" 2>/dev/null || echo "$L")
          # A GitHub step runs without pipefail, so this took its exit status
          # from tail and a failing install passed (pass 25).
          node bin/rot-dtd-commander.mjs install --yes --target "$T" > "$L/install.log" 2>&1 || { tail -20 "$L/install.log"; exit 1; }
          tail -3 "$L/install.log"
          test -f "$T/.rot-dtd-commander-manifest.json"
          # || true discarded every row and nothing read them, so the step
          # named a doctor it never listened to (pass 25).
          # || true discards the exit on purpose: a scratch install is not armed
          # (deliberate since 5.0.0), so doctor exits 1 for a correct install and
          # the rows are what this step reads.
          CLAUDE_CONFIG_DIR="$T" node bin/adiutor.mjs doctor > "$L/doctor.log" 2>&1 || true
          cat "$L/doctor.log"
          # The row, not a phrase: pass 25 reworded the summary to "158 installed
          # main files, 0 failing C1..C16" and this grep still asked for "every
          # one installed", so it failed on a healthy install (pass 27, caught by
          # CI). Matched loosely so a recount or a rule range does not break it.
          grep -qE "OK +checker +[0-9]+ installed main files, 0 failing" "$L/doctor.log"
          grep -qE "OK +double install" "$L/doctor.log"
          # Its exit came from tail, exactly as the install step did (pass 26).
          node bin/rot-dtd-commander.mjs uninstall --yes --target "$T" > "$L/uninstall.log" 2>&1 || { tail -20 "$L/uninstall.log"; exit 1; }
          tail -1 "$L/uninstall.log"
          left=$(find "$T" -type f | wc -l)
          echo "files left: $left"
          test "$left" -eq 0

  scala:
    # One scala per family run end to end through a real model on every leg
    # (9.0.0). It runs on a release tag and by hand, never on every push:
    # sixteen chains on three legs is a cost the operator chooses. The model
    # credential arrives as one masked secret written to the config dir of the
    # runner and nowhere else; a leg without the secret says so and stops with
    # exit 0, because a check that did not run must never look like one that
    # passed.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      XOS_LEG: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: the claude CLI on this leg
        run: |
          npm install -g @anthropic-ai/claude-code > /dev/null 2>&1
          claude --version
      - name: the credential, one masked secret, written to the runner's config dir and nowhere else
        env:
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$CLAUDE_CREDENTIALS_JSON" ]; then echo "no CLAUDE_CREDENTIALS_JSON secret on this repository: the scala is UNRUN on $XOS_LEG"; echo "SCALA_SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          C=$(mktemp -d); C=$(cygpath -m "$C" 2>/dev/null || echo "$C")
          printf '%s' "$CLAUDE_CREDENTIALS_JSON" > "$C/.credentials.json"
          chmod 600 "$C/.credentials.json"
          echo "CLAUDE_CONFIG_DIR=$C" >> "$GITHUB_ENV"
          echo "credential written, $(wc -c < "$C/.credentials.json") bytes"
      - name: one scala per family, every family, scored on the headings each member owns
        if: env.SCALA_SKIP != '1'
        run: |
          O=$(mktemp -d); O=$(cygpath -m "$O" 2>/dev/null || echo "$O")
          set +e
          node checker/scala.mjs run --all --out "$O" --turns 60 --secs 1500
          rc=$?
          set -e
          ls -l "$O"
          exit $rc

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, install-roundtrip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: the tag names the one version the manifests, the changelog and RELEASE.md share
        run: node checker/release-notes.mjs --versions "$GITHUB_REF_NAME"
      - name: the notes are the CHANGELOG section of that version, dated, no longer in progress
        run: |
          node checker/release-notes.mjs "${GITHUB_REF_NAME#v}" > notes.md
          test -s notes.md
          wc -c notes.md
          head -5 notes.md
      - name: ship the release (a release already on the tag is left alone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
        run: |
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json")
          code=$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "$API/releases/tags/$GITHUB_REF_NAME")
          if [ "$code" = "200" ]; then echo "release $GITHUB_REF_NAME already exists: nothing shipped"; exit 0; fi
          node checker/release-notes.mjs --payload "$GITHUB_REF_NAME" > payload.json
          code=$(curl -s -o response.json -w '%{http_code}' -X POST "${auth[@]}" "$API/releases" --data @payload.json)
          echo "http $code"
          test "$code" = "201" || { cat response.json; exit 1; }
          node -e 'const r=require("./response.json");console.log("shipped", r.tag_name, r.name, r.html_url)'

      - name: attach the archive claude.ai and Claude Cowork accept
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          UPLOADS: ${{ github.server_url == 'https://github.com' && 'https://uploads.github.com' || github.api_url }}/repos/${{ github.repository }}
        run: |
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          # The packer refuses to name a canonical archive before one combination
          # has been uploaded and accepted (exit 2). Until then every candidate is
          # attached and the run is annotated, so a release never silently ships
          # an archive nobody has proved installs.
          set +e
          node checker/pack-claude-ai.mjs --out dist
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            echo "::warning title=hosted plugin::no combination is recorded in checker/hosted-plugin.json yet; attaching every candidate instead of one canonical archive"
            node checker/pack-claude-ai.mjs --all --out dist
          elif [ "$rc" != "0" ]; then
            exit "$rc"
          fi
          # Two checksum artifacts beside the archive, digested in Node rather
          # than by sha256sum, which the macOS leg lacks (LAW.XOS.4). GitHub
          # already attaches its own Source code (zip) and (tar.gz) with digests;
          # these cover the asset GitHub did not build, so a downloader can
          # verify the one file that matters without trusting the release page.
          ( cd dist && node -e 'const c=require("crypto"),f=require("fs");const sums=[];for(const z of f.readdirSync(".").filter((n)=>n.endsWith(".zip")).sort()){const d=c.createHash("sha256").update(f.readFileSync(z)).digest("hex");f.writeFileSync(z+".sha256",d+"  "+z+"\n");sums.push(d+"  "+z)}f.writeFileSync("SHA256SUMS",sums.join("\n")+"\n")' )
          ls -l dist
          cat dist/SHA256SUMS
          rel=$(curl -s "${auth[@]}" "$API/releases/tags/$GITHUB_REF_NAME")
          id=$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(!r.id){console.error(s);process.exit(1)}console.log(r.id)})' <<< "$rel")
          for z in dist/*.zip dist/*.sha256 dist/SHA256SUMS; do
            n=$(basename "$z")
            # 422 is what the API answers for an asset already on the release.
            # Re-running a release must not fail on work already done, so 201
            # and 422 are both success and anything else is not.
            case "$n" in *.zip) ct=application/zip ;; *) ct=text/plain ;; esac
            code=$(curl -s -o up.json -w '%{http_code}' -X POST "${auth[@]}" -H "Content-Type: $ct" "$UPLOADS/releases/$id/assets?name=$n" --data-binary @"$z")
            echo "$n http $code"
            case "$code" in
              201) : ;;
              422) echo "asset $n already on the release: left alone" ;;
              *) cat up.json; exit 1 ;;
            esac
          done
          echo "attached $(ls dist/ | wc -l) file(s) to $GITHUB_REF_NAME (archive, per-file .sha256, SHA256SUMS)"
